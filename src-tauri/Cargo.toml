[package]
name = "graph-enj"
version = "0.1.0"
description = "Local coding-agent graph studio and session control plane"
authors = ["Graph_Enj"]
edition = "2021"

[lib]
name = "graph_enj_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.6"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
md-5 = "0.11.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
